# Same-origin setup as production: the UI and the Django backend share one host.
# Mirrors src/setupProxy.js, which does this job for `yarn start`.
server {
    listen 80;
    server_name _;

    # Docker's embedded DNS; a variable makes nginx resolve "api" at request
    # time, so the UI starts even if the API stack is not up yet.
    resolver 127.0.0.11 valid=10s;
    set $backend http://api:8000;

    location ~ ^/(admin|api|assets|auth|o)(/|$) {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
