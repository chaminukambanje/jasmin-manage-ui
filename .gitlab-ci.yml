# Delivery workflow
#   any branch / merge request  -> test
#   devel                       -> test, build, deploy to development (automatic)
#   master                      -> test, build, deploy to staging (automatic),
#                                  then production (manual approval, same image)
#
# development and staging run on the CI Docker host; production is deployed over
# SSH to the Docker server PROD_DOCKER_HOST, published at PROD_URL. The deploy
# key and host keys are the production-scoped, protected CI/CD variables
# PROD_SSH_KEY_B64 and PROD_SSH_KNOWN_HOSTS. To rehearse against the local
# stand-in instead, run a pipeline with PROD_DOCKER_HOST=tcp://prod-docker-server:2375.
# The UI proxies /api, /admin, /auth and /assets to the jasmin-manage API stack
# of the same environment.

stages: [test, build, development, staging, production]

variables:
  IMAGE: jasmin-manage-ui:$CI_COMMIT_SHORT_SHA
  PROD_DOCKER_HOST: ssh://root@192.168.0.218
  PROD_URL: http://192.168.0.218:3300
  YARN: node .yarn/releases/yarn-4.5.1.cjs

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

test:
  stage: test
  image: node:22-bookworm
  variables:
    YARN_CACHE_FOLDER: $CI_PROJECT_DIR/.yarn/cache
    YARN_ENABLE_GLOBAL_CACHE: "false"
  cache:
    key:
      files: [yarn.lock]
    paths: [.yarn/cache]
  script:
    - $YARN install --immutable
    - CI=true $YARN test --watchAll=false --passWithNoTests

build:
  stage: build
  image: docker:27-cli
  script:
    - docker build -t "$IMAGE" .
  rules:
    - if: $CI_COMMIT_BRANCH == "devel" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.deploy:
  image: docker:27-cli
  variables:
    UI_IMAGE: $IMAGE
    DEPLOY_ENV: $CI_ENVIRONMENT_NAME
  script:
    - docker network inspect "jasmin-$DEPLOY_ENV" >/dev/null 2>&1 || docker network create "jasmin-$DEPLOY_ENV"
    - docker compose -p "jasmin-ui-$DEPLOY_ENV" -f deploy/docker-compose.yml up -d --wait --wait-timeout 120
    # Smoke test from inside the environment's network: the page itself, then the API through the proxy
    - docker run --rm --network "jasmin-$DEPLOY_ENV" busybox:1.36 wget -qO /dev/null http://ui/
    - docker run --rm --network "jasmin-$DEPLOY_ENV" busybox:1.36 wget -qO- http://ui/api/

deploy:development:
  extends: .deploy
  stage: development
  variables:
    UI_PORT: "3100"
  environment:
    name: development
    url: http://localhost:3100
  rules:
    - if: $CI_COMMIT_BRANCH == "devel"

deploy:staging:
  extends: .deploy
  stage: staging
  variables:
    UI_PORT: "3200"
  environment:
    name: staging
    url: http://localhost:3200
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:production:
  extends: .deploy
  stage: production
  variables:
    UI_PORT: "3300"
    UI_BIND: 0.0.0.0   # reachable on the server's network
  environment:
    name: production
    url: $PROD_URL
  before_script:
    # Ship the exact image that was verified on staging to the production server
    - |
      if [ -n "$PROD_SSH_KEY_B64" ]; then
        apk add --no-cache openssh-client >/dev/null
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        echo "$PROD_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
        echo "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      fi
    - docker save "$IMAGE" | docker -H "$PROD_DOCKER_HOST" load
    - export DOCKER_HOST="$PROD_DOCKER_HOST"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
